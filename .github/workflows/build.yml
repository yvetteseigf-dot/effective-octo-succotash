name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        id: unzip
        run: |
          unzip -o -q ./skycore-elytratarget-updated.zip -d project
          GRADLE_FILE=$(find project -name build.gradle | head -1)
          echo "dir=$(dirname "$GRADLE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --no-daemon
        working-directory: ${{ steps.unzip.outputs.dir }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: skycore-mod
          path: |
            ${{ steps.unzip.outputs.dir }}/build/libs/*.jar
            !${{ steps.unzip.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.unzip.outputs.dir }}/build/libs/*-dev.jar
